[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aakaar-capabilities"
version = "0.1.0"
description = "Shared Aakaar capabilities — write a capability once, run it on the server or a remote agent."
requires-python = ">=3.11"
# PyNaCl powers the back-channel sealed-box transport (aakaar_caps.sealing) used
# by both the server and the agent. Small, wheels on all platforms; sealing
# degrades to a loud cleartext fallback if it's somehow absent.
dependencies = ["pydantic>=2.6,<3", "pynacl>=1.5"]

[project.optional-dependencies]
# Heavy/optional libs used by some shared caps are imported lazily; install
# them on whichever host (server or agent) needs that capability.
sys = ["psutil>=5.9"]
# Browser automation runtime (Playwright). Needed on whichever host runs the
# browser.*/cap.web_* capabilities — the server, or a remote agent that drives
# a local browser. Imported lazily, so `aakaar_caps` stays importable without it.
browser = ["playwright>=1.47"]
# CTS cheque-vision pipeline (cap.cheque_*). RapidOCR ships its PP-OCR ONNX
# models inside the wheel — fully offline, CPU-only, no model download and no
# third-party service. Imported lazily so the server can register the caps
# without them; install on the host that EXECUTES the cheque caps.
cheque = [
    "rapidocr>=2.0",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
]
# Native host-automation caps (office docs, host telemetry, screen OCR). All
# imported lazily with a graceful missing-dep fallback; install per host.
automation = [
    "psutil>=5.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "mss>=9.0",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["aakaar_caps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
