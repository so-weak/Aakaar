[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aakaar-agent"
version = "0.1.0"
description = "Aakaar remote execution agent — runs capability nodes on a workstation."
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "psutil>=5.9",
    # NOTE: the shared capability library `aakaar-capabilities` (package
    # `aakaar_caps`) is a monorepo sibling, not on PyPI. start.sh installs it
    # editable next to this package (`-e ../aakaar-capabilities`); the PyInstaller
    # build must bundle `aakaar_caps` as a hidden import (packaging step).
]

[project.optional-dependencies]
# GUI/desktop automation — only needed on agents that run desktop_* capabilities
# in an interactive session. Imported lazily so a headless agent never needs them.
gui = ["pyautogui>=0.9", "pyperclip>=1.8", "pygetwindow>=0.0.9"]
# Activity recording — global input listeners for cap.activity_recording.
# Imported lazily; an agent without this extra refuses the capability cleanly.
record = ["pynput>=1.7"]
# Browser automation — Playwright, so this agent can run the browser.*/cap.web_*
# stack locally (the live Chromium lives on the agent). Imported lazily; the
# Chromium binary is provisioned out-of-band (`playwright install chromium`).
browser = ["playwright>=1.47"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aakaar-agent = "aakaar_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["aakaar_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
