[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aakar"
version = "0.0.1"
description = "Aakar — multi-tenant NL→DAG workflow platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "openai>=1.40",
    "sentence-transformers>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.1",
    "PyJWT>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["aakar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # faiss' SWIG bindings emit a few DeprecationWarnings at import time on
    # Python 3.13. These come from the C extension and we can't fix them here;
    # silence them so the strict-warnings policy still works for our code.
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
