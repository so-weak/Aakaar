name: Loadtest

# Manual-only: load numbers from shared CI runners are for trend comparison
# between runs of THIS workflow, never absolute capacity claims. Not a PR
# gate. See loadtest/README.md for the local procedure and thresholds.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Concurrent virtual users
        required: false
        default: "5"
      duration:
        description: Scenario duration (k6 syntax, e.g. 1m, 90s)
        required: false
        default: "1m"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  k6:
    name: k6 run/poll scenario (SQLite API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aakaar
    env:
      AAKAAR_JWT_SECRET: ci-loadtest-only-secret-not-production
      AAKAAR_DB_URL: sqlite:///./data/aakaar.sqlite
      AAKAAR_SUPERUSER_EMAIL: loadtest@example.com
      AAKAAR_SUPERUSER_PASSWORD: loadtest-password-1
      AAKAAR_BROWSER_POOL: none
      AAKAAR_SCHEDULER_ENABLED: "false"
      # All k6 VUs share one client IP; the per-IP token bucket (240/min
      # default) would dominate the measurement, so it is disabled here.
      AAKAAR_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aakaar/pyproject.toml

      - name: Install (editable, runtime deps)
        run: pip install -e . -e ../aakaar-capabilities

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Migrate + boot API
        run: |
          mkdir -p data
          alembic upgrade head
          nohup uvicorn aakaar.api.main:app --host 127.0.0.1 --port 8000 \
            > api.log 2>&1 &
          echo $! > uvicorn.pid
          # readiness poll (smoke/seed also poll, but fail fast here)
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz

      - name: Seed tenant + workflow
        run: |
          python ../loadtest/ci/seed.py > k6.env
          # seed.py prints `export KEY=value` lines; GITHUB_ENV wants KEY=value
          sed 's/^export //' k6.env >> "$GITHUB_ENV"

      - name: k6
        working-directory: loadtest
        run: |
          k6 run k6/runs.js \
            -e AAKAAR_API=http://127.0.0.1:8000 \
            -e AAKAAR_EMAIL="$AAKAAR_EMAIL" \
            -e AAKAAR_PASSWORD="$AAKAAR_PASSWORD" \
            -e AAKAAR_WORKFLOW_ID="$AAKAAR_WORKFLOW_ID" \
            -e VUS="${{ inputs.vus }}" \
            -e DURATION="${{ inputs.duration }}"

      - name: API log on failure
        if: failure()
        run: tail -200 api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true
