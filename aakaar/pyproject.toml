[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aakaar"
version = "0.0.1"
description = "Aakaar — multi-tenant NL→DAG workflow platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "numpy>=1.26",
    # Vector DB: Chroma with a local persistent (SQLite-backed) store. We
    # always supply our own BGE embeddings, so chromadb's bundled ONNX
    # embedder is never used; its `tokenizers<=0.20.3` pin is therefore
    # cosmetic and is intentionally overridden by sentence-transformers'
    # newer tokenizers at runtime.
    "chromadb>=0.5,<0.6",
    "openai>=1.40",
    "sentence-transformers>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.1",
    "PyJWT>=2.9",
    # RS256/JWKS signing + verification (PyJWT's asymmetric algorithms need a
    # crypto backend) and Fernet encryption of TOTP secrets at rest.
    "cryptography>=42.0",
    # TOTP (RFC 6238) for MFA.
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.47",
    "asyncssh>=2.14",
    # Observability + platform
    "prometheus-client>=0.20",
    # Scheduling (cron parsing)
    "croniter>=2.0",
    # Server-local capability libraries (document/data/image processing)
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "pillow>=10.0",
    # NOTE: the shared capability library `aakaar-capabilities` (package
    # `aakaar_caps`) is a sibling in this monorepo, not on PyPI. It is installed
    # editable alongside this package by start.sh (`-e ../aakaar-capabilities`),
    # so it is intentionally NOT listed here as a resolvable dependency.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# OCR needs the system `tesseract` binary in addition to this wrapper, so it
# is opt-in; the ocr_extract capability imports it lazily and errors clearly
# if unavailable.
ocr = ["pytesseract>=0.3"]
# Postgres driver — required when AAKAAR_DB_URL is postgresql+psycopg (prod /
# RLS). Not needed for the SQLite dev default. The Docker image bundles it.
postgres = ["psycopg[binary]>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["aakaar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # chromadb and its transitive deps emit assorted DeprecationWarnings at
    # import time (protobuf, pydantic-v1 shims, websockets). These originate
    # in third-party code we can't fix here; ignore them so the strict
    # "error" policy still guards our own code.
    "ignore::DeprecationWarning:chromadb",
    "ignore::DeprecationWarning:google.protobuf",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:importlib._bootstrap",
    # Starlette's TestClient warns when paired with newer httpx — a third-party
    # deprecation in the test transport we don't control. Ignoring it keeps the
    # strict "error" policy guarding our own code while the pinned runtime works.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # chromadb's PersistentClient holds a SQLite connection that it does not
    # close deterministically; when a test's client is GC'd mid-session the
    # ResourceWarning surfaces as PytestUnraisableExceptionWarning. The API
    # process creates exactly one long-lived client, so this is a test-harness
    # artifact of spinning up many stores, not a real leak.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
